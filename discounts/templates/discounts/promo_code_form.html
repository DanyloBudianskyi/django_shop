{% extends "main/base.html" %}
{% block title %}Додати знижку{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto py-10">
    <h2 class="text-3xl font-bold mb-6">Створити промокод</h2>

    <form method="post" class="space-y-6">
        {% csrf_token %}
        {{ form.non_field_errors }}

        {% for field in form %}
            <div>
                <label class="block font-semibold mb-2 text-gray-700">{{ field.label }}</label>
                {{ field }}

                {% if field.errors %}
                    <p class="text-red-500 text-sm mt-1">{{ field.errors.0 }}</p>
                {% endif %}
            </div>
        {% endfor %}

        <div class="flex gap-4">
            <button type="submit"
                class="px-6 py-3 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white">
                Створити
            </button>

            <a href="{{ product.get_absolute_url }}"
               class="px-6 py-3 rounded-lg bg-gray-300 text-gray-900">
                Скасувати
            </a>
        </div>
    </form>
</div>
{% endblock %}
